<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NARUTO × SASUKE — Experience</title>
  
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>

  <style>
    body { margin: 0; overflow: hidden; background-color: black; }
    #v_src, #out {
      position: absolute; top: 0; left: 0;
      width: 100vw; height: 100vh;
      object-fit: cover; transform: scaleX(-1);
    }
    #out { z-index: 2; pointer-events: none; }
    .darkness {
      position: absolute; top: 0; left: 0;
      width: 100vw; height: 100vh;
      background: rgba(10, 5, 0, 0.3);
      mix-blend-mode: multiply; pointer-events: none; z-index: 5;
    }
    .fx {
      position: absolute; height: auto; top: 0; left: 0;
      transform: translate(-50%, -50%);
      pointer-events: none; display: none;
      mix-blend-mode: screen; z-index: 20;
    }
    #n { width: 1600px; }
    #s { width: 2400px; }
    .back {
      position: fixed; top: 16px; left: 16px; z-index: 100;
      display: inline-flex; align-items: center; gap: 8px;
      color: #f5f5f7; text-decoration: none; font-size: 13px; font-weight: 600;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      padding: 9px 16px; border-radius: 999px;
      background: rgba(10, 10, 16, 0.55);
      border: 1px solid rgba(255,255,255,0.16);
      backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
      transition: background 0.25s, transform 0.25s;
    }
    .back:hover { background: rgba(255,255,255,0.14); transform: translateY(-1px); }
    .hint {
      position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%);
      z-index: 100; color: rgba(255,255,255,0.75); font-size: 12.5px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      letter-spacing: 0.02em; text-align: center;
      background: rgba(10,10,16,0.55); border: 1px solid rgba(255,255,255,0.16);
      padding: 9px 18px; border-radius: 999px;
      backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
      white-space: nowrap;
    }
    @media (max-width: 640px) {
      .hint { white-space: normal; width: calc(100% - 32px); border-radius: 16px; }
    }

    /* ---------- Loading intro: Rasengan x Chidori ---------- */
    #loadOverlay {
      position: fixed; inset: 0; z-index: 300;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      background:
        radial-gradient(52% 42% at 50% 42%, rgba(255,138,0,0.10), transparent 70%),
        radial-gradient(52% 42% at 50% 62%, rgba(0,152,255,0.10), transparent 70%),
        #050508;
      opacity: 1;
      transition: opacity 0.9s ease 0.15s, visibility 0s linear 1.05s;
    }
    #loadOverlay.done { opacity: 0; visibility: hidden; }
    .l-stage { position: relative; width: 330px; height: 300px; }
    .l-orb {
      position: absolute; left: 50%; top: 50%;
      width: 132px; height: 132px; margin: -66px 0 0 -66px;
      border-radius: 50%; will-change: transform;
    }
    .orb-n {
      background: radial-gradient(circle at 34% 34%, #ffe9c9, #ff8a00 42%, #ff3d00 78%, rgba(255,61,0,0));
      box-shadow: 0 0 70px 26px rgba(255, 138, 0, 0.45);
      animation: nIn 2.6s cubic-bezier(0.22, 1, 0.36, 1) both;
    }
    .orb-s {
      background: radial-gradient(circle at 34% 34%, #d8f6ff, #00c8ff 42%, #0033ff 78%, rgba(0,51,255,0));
      box-shadow: 0 0 70px 26px rgba(0, 150, 255, 0.45);
      animation: sIn 2.6s cubic-bezier(0.22, 1, 0.36, 1) both;
    }
    @keyframes nIn {
      0% { transform: translateX(-55vw) scale(0.55); }
      38% { transform: translateX(0) scale(1); }
      55% { transform: translateX(-52px) scale(1.08); }
      75%, 100% { transform: translateX(-40px) scale(1); }
    }
    @keyframes sIn {
      0% { transform: translateX(55vw) scale(0.55); }
      38% { transform: translateX(0) scale(1); }
      55% { transform: translateX(52px) scale(1.08); }
      75%, 100% { transform: translateX(40px) scale(1); }
    }
    .l-spin {
      position: absolute; inset: -20px; border-radius: 50%;
      background: conic-gradient(from 90deg, transparent 0% 32%, rgba(255,255,255,0.9) 48% 52%, transparent 68%);
      mix-blend-mode: screen; filter: blur(1.2px);
      animation: spinL 1.2s linear infinite;
    }
    .orb-s .l-spin { animation: spinL 1.2s linear infinite reverse; }
    @keyframes spinL { to { transform: rotate(360deg); } }
    .l-orbit {
      position: absolute; left: 50%; top: 50%;
      width: 300px; height: 300px; margin: -150px 0 0 -150px;
      border: 1px dashed rgba(255,255,255,0.14); border-radius: 50%;
      animation: orbitIn 0.8s ease 1.0s both, orbitSpin 4.5s linear 1.0s infinite;
    }
    .l-orbit::before, .l-orbit::after {
      content: ""; position: absolute; width: 9px; height: 9px; border-radius: 50%; top: -4.5px;
    }
    .l-orbit::before { left: 50%; margin-left: -4.5px; background: #ffb44d; box-shadow: 0 0 10px #ff8a00; }
    .l-orbit::after { right: 14%; background: #7dd3fc; box-shadow: 0 0 10px #00c8ff; }
    @keyframes orbitIn { from { opacity: 0; transform: scale(0.6); } to { opacity: 1; transform: scale(1); } }
    @keyframes orbitSpin { to { transform: rotate(360deg); } }
    .l-boom {
      position: absolute; left: 50%; top: 50%;
      width: 140px; height: 140px; margin: -70px 0 0 -70px;
      border: 2px solid rgba(255,255,255,0.65); border-radius: 50%;
      animation: boom 0.9s ease-out 1.0s both;
    }
    @keyframes boom {
      0% { opacity: 0.9; transform: scale(0.35); }
      100% { opacity: 0; transform: scale(5.2); }
    }
    .l-text { text-align: center; margin-top: 44px; }
    .l-title { font-size: 15px; font-weight: 700; letter-spacing: 0.14em; color: #f5f5f7; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .l-title span { color: #86868b; font-weight: 400; margin: 0 6px; }
    .l-sub { margin-top: 10px; font-size: 13px; color: #86868b; letter-spacing: 0.02em; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .l-bar { width: 220px; height: 4px; border-radius: 999px; background: rgba(255,255,255,0.08); margin: 18px auto 0; overflow: hidden; }
    .l-bar i {
      display: block; height: 100%; width: 0; border-radius: 999px;
      background: linear-gradient(90deg, #ff8a00, #00c8ff);
      animation: loadBar 2.6s cubic-bezier(0.22, 1, 0.36, 1) both;
    }
    @keyframes loadBar { from { width: 0; } to { width: 100%; } }
    .l-err { margin-top: 18px; font-size: 13px; line-height: 1.9; color: #ff9d9d; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .l-err button {
      display: block; margin: 8px auto 0; cursor: pointer;
      background: linear-gradient(135deg, #ff8a00, #ff5e00); border: 0; color: #fff;
      font-weight: 600; font-size: 13px; padding: 9px 20px; border-radius: 999px;
    }
    @media (prefers-reduced-motion: reduce) {
      .l-orb, .l-orbit, .l-boom, .l-spin, .l-bar i { animation: none !important; }
      .l-orb { transform: translateX(0) scale(1); }
      .l-orbit { opacity: 1; transform: scale(1); }
    }
  </style>
</head>
<body>

  <div id="loadOverlay">
    <div class="l-stage">
      <div class="l-orbit"></div>
      <div class="l-orb orb-n"><div class="l-spin"></div></div>
      <div class="l-orb orb-s"><div class="l-spin"></div></div>
      <div class="l-boom"></div>
    </div>
    <div class="l-text">
      <p class="l-title">NARUTO <span>×</span> SASUKE</p>
      <p class="l-sub" id="lSub">Membangkitkan kekuatan…</p>
      <div class="l-bar" id="lBarWrap"><i></i></div>
      <p class="l-err" id="lErr" hidden>Izin kamera diperlukan untuk masuk arena.<br><button type="button" onclick="location.reload()">Coba lagi</button></p>
    </div>
  </div>

  <a class="back" href="index.html">
    <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M11 18l-6-6 6-6"/></svg>
    Home
  </a>

  <video id="v_src" autoplay playsinline></video>
  <canvas id="out"></canvas>
  <div class="darkness"></div>

  <div class="hint">Left hand = Naruto &nbsp;·&nbsp; Right hand = Sasuke</div>

  <video id="n" class="fx" src="assets/naruto.mp4" muted autoplay loop playsinline></video>
  <video id="s" class="fx" src="assets/sasuke.mp4" muted autoplay loop playsinline></video>

  <script>
    const loadOverlay = document.getElementById('loadOverlay');
    const loadStart = performance.now();
    let loadRevealed = false;
    let loadFailed = false;

    function revealLoad() {
      if (loadRevealed || loadFailed) return;
      if (performance.now() - loadStart < 2500) return;
      loadRevealed = true;
      loadOverlay.classList.add('done');
    }
    setTimeout(() => { if (!loadFailed) revealLoad(); }, 8000);

    const vElement = document.getElementById('v_src');
    const cElement = document.getElementById('out');
    const ctx = cElement.getContext('2d');
    const n = document.getElementById('n');
    const s = document.getElementById('s');

    let pwr = [0, 0]; 
    let wasOpen = [false, false];

    function checkOpen(pts) {
        let count = 0;
        const wrist = pts[0];
        const tips = [8, 12, 16, 20];
        const pips = [6, 10, 14, 18];
        for (let i = 0; i < tips.length; i++) {
            const tip = pts[tips[i]];
            const pip = pts[pips[i]];
            if (Math.hypot(tip.x - wrist.x, tip.y - wrist.y) > Math.hypot(pip.x - wrist.x, pip.y - wrist.y)) count++;
        }
        return count >= 3;
    }

    function onResults(res) {
        revealLoad();
        cElement.width = vElement.videoWidth;
        cElement.height = vElement.videoHeight;
        ctx.save();
        ctx.clearRect(0, 0, cElement.width, cElement.height);

        let fL = false;
        let fR = false;

        n.style.display = 'none';
        s.style.display = 'none';

        if (res.multiHandLandmarks && res.multiHandedness) {
            res.multiHandLandmarks.forEach((pts, i) => {
                const label = res.multiHandedness[i].label;
                const isR = label === 'Right';
                const idx = isR ? 1 : 0;

                // --- BRIGHT BLUE SKELETON ---
                ctx.save();
                ctx.shadowBlur = 10;
                ctx.shadowColor = '#00fbff';
                drawConnectors(ctx, pts, HAND_CONNECTIONS, {color: '#00d4ff', lineWidth: 3});
                drawLandmarks(ctx, pts, {color: '#ffffff', lineWidth: 1, radius: 2});
                ctx.restore();

                const open = checkOpen(pts);
                pwr[idx] += open ? 0.05 : -0.15;
                pwr[idx] = Math.max(0, Math.min(1, pwr[idx]));

                if (open && !wasOpen[idx]) {
                    const vid = isR ? s : n;
                    vid.currentTime = 0;
                    vid.play();
                }
                wasOpen[idx] = open;

                const wrist = pts[0];
                const knk = pts[9];

                if (pwr[idx] > 0.01) {
                    if (isR) { 
                        fR = true;
                        const tx = (wrist.x + knk.x) / 2;
                        const ty = (wrist.y + knk.y) / 2;
                        s.style.left = `${(1 - tx) * window.innerWidth}px`;
                        s.style.top = `${ty * window.innerHeight}px`;
                        s.style.display = 'block';
                        s.style.opacity = pwr[idx]; 
                    } else { 
                        fL = true;
                        const dx = knk.x - wrist.x;
                        const dy = knk.y - wrist.y;
                        const tx = knk.x + (dx * 0.8);
                        const ty = knk.y + (dy * 0.8);
                        n.style.left = `${(1 - tx) * window.innerWidth}px`;
                        n.style.top = `${(ty * window.innerHeight) - 120}px`;
                        n.style.display = 'block';
                        n.style.opacity = pwr[idx]; 
                    }
                }
            });
        }

        if (!fL) {
            pwr[0] = Math.max(0, pwr[0] - 0.15);
            if (pwr[0] > 0.01) { n.style.display = 'block'; n.style.opacity = pwr[0]; }
            wasOpen[0] = false;
        }
        if (!fR) {
            pwr[1] = Math.max(0, pwr[1] - 0.15);
            if (pwr[1] > 0.01) { s.style.display = 'block'; s.style.opacity = pwr[1]; }
            wasOpen[1] = false;
        }
        ctx.restore();
    }

    const h = new Hands({
        locateFile: (f) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${f}`
    });

    h.setOptions({
        maxNumHands: 2,
        modelComplexity: 1,
        minDetectionConfidence: 0.65,
        minTrackingConfidence: 0.65
    });

    h.onResults(onResults);

    const cam = new Camera(vElement, {
        onFrame: async () => { await h.send({ image: vElement }); },
        width: 1280, height: 720
    });
    cam.start().catch(() => {
        loadFailed = true;
        document.getElementById('lErr').hidden = false;
        document.getElementById('lBarWrap').style.display = 'none';
        document.getElementById('lSub').textContent = 'Kamera tidak bisa diakses';
    });
  </script>
</body>
</html>
